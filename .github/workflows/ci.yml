name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs on main queue up and finish; a newer push to a pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # A non-root base, so a link that ignores the base fails the link check (D007).
      BASE_PATH: /ci-base
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Lighthouse uses the runner's Google Chrome.
      - name: Lighthouse, mobile (must pass)
        run: npx --yes @lhci/cli@0.16.0 autorun
      - name: Lighthouse, desktop (reference)
        if: ${{ !cancelled() }}
        env:
          LHCI_PRESET: desktop
        run: |
          npx --yes @lhci/cli@0.16.0 collect
          npx --yes @lhci/cli@0.16.0 upload
      - if: ${{ !cancelled() }}
        run: npm run lighthouse:summary
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            artifacts/audit/
            .lighthouseci/
          include-hidden-files: true
